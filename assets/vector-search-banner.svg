<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CPU Vector Search Engine</title>
  <desc id="desc">An illustration of vectors in a glowing coordinate plane beside a fast CPU retrieval pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102c49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48e0c2"/>
      <stop offset="1" stop-color="#62a9ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#28d9c0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#28d9c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb9d5" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="820" cy="180" r="285" fill="url(#glow)"/>
  <rect x="660" y="35" width="490" height="290" rx="20" fill="url(#grid)" stroke="#8ab2d1" stroke-opacity=".17"/>
  <path d="M690 275H1115M730 300V58" fill="none" stroke="#adc5dc" stroke-opacity=".6" stroke-width="2"/>
  <path d="M740 255L1015 86" fill="none" stroke="#54e0c3" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M740 255L1054 193" fill="none" stroke="#72aaff" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M740 255L925 290" fill="none" stroke="#f1b86d" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>
  <circle cx="1015" cy="86" r="9" fill="#54e0c3" stroke="#d7fff8" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="1054" cy="193" r="9" fill="#72aaff" stroke="#e3edff" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="925" cy="290" r="7" fill="#f1b86d"/>
  <circle cx="740" cy="255" r="8" fill="#fff"/>
  <text x="70" y="94" fill="#7debd6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">CPU-OPTIMIZED · VECTOR RETRIEVAL</text>
  <text x="68" y="158" fill="#f4f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="750">Find the closest</text>
  <text x="68" y="208" fill="#f4f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="750">vectors. <tspan fill="url(#accent)">Faster.</tspan></text>
  <text x="70" y="252" fill="#b7c9dc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Cosine similarity · in-place normalization · Top-K</text>
  <rect x="70" y="282" width="160" height="4" rx="2" fill="url(#accent)"/>
</svg>
